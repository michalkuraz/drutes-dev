#
# uniform: one pair of records for all mesh materials. For zones use materials,
# one pair per material ID, then end materials.
uniform
# Longitudinal and transverse dispersivities [m]: spreading along and across flow.
200.0 0.2
# Effective particle retention: k_dep [1/s], given on the line below.
# Enter a finite, nonnegative first-order rate, not a settling velocity [m/s].
# 0 disables retention; larger values remove suspended mass faster.
# The sink is -k_dep * M, where M = H_eff * C is the model's suspended
# mass per unit horizontal area. H_eff is the equivalent storage depth [m],
# not the physical channel depth; C is the suspended concentration.
# H_eff converts concentration to inventory only. Do not estimate k_dep
# as settling velocity divided by H_eff. In a well-mixed physical column
# the corresponding estimate is w_s / h_real, using real channel depth.
# Without physical depth data, treat k_dep as an effective rate for calibration
# or sensitivity analysis. ADEnc does not model bed storage or resuspension.
# For deposition alone, the suspended inventory decays as exp(-k_dep*t)
# with t in seconds: half-life = ln(2)/k_dep. Example: 1e-5 [1/s] gives
# about 19.3 hours. This is an illustration, not a calibrated rate.
# uniform: one rate for all materials. In a materials block, give one
# k_dep line immediately below the dispersivities of each mesh material.
# With mass auditing enabled and any positive k_dep, adenc_mass_balance.csv
# reports step_deposited and cumulative_deposited as physical losses from
# suspension, not as numerical mass-balance error.
0.0


#define minimal discharge treshold to separate river channel
300

##define initial condition (at the moment constatnt for the entire watershed
0.0

# number of channel paths: channel.dat, channel2.dat, ..., channelN.dat
1



transport
# Zero total solute flux on banks [y/n]
y
# Conservative formulation is always used; deposition removes suspended mass.
# Write accepted-step mass balance [y/n]
n
# No outlet profile specified: use unreconstructed flux and log a warning.
end transport


