#model start time
#year month day 
2015 6 1

#
# uniform: one pair of records for all mesh materials. For zones use materials,
# one pair per material ID, then end materials.
uniform
# Longitudinal and transverse dispersivities [m]: spreading along and across flow.
200.0 0.2
# First-order deposition k_dep [1/s]: removes suspended mass at rate k_dep * H * C; 0 = no loss.
0.0


#define minimal discharge treshold to separate river channel
300

##define initial condition (at the moment constatnt for the entire watershed
0.0

# number of channel paths: channel.dat, channel2.dat, ..., channelN.dat
1



transport
# Zero total solute flux on banks [y/n]
y
# Conservative formulation is always used; deposition removes suspended mass.
# Write accepted-step mass balance [y/n]
n
# No outlet profile specified: use unreconstructed flux and log a warning.
end transport


# Boundary records must be ordered 101 through max(mesh boundary ID)+1.
# The last ID is the automatically added inactive boundary.
# With inlet IDs 101 and 102, supply records 101, 102, 103 and optional 101.bc/102.bc.
# boundary ID       boundary type       use bc.dat [y/n]   value         
#-------------------------------------------------------------------------------
101                       1                   y                1.0
102                       1                   n                0.0      
